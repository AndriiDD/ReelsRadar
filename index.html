<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ИИ рилс-продюсер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--sb:#fafafa;--ink:#111;--mute:#7b7b78;--line:#e8e8e5;--soft:#f3f3f1;--ok:#1f7a45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--sb:#1b1b1b;--ink:#f2f2ef;--mute:#9a9a95;--line:#2d2d2b;--soft:#222221;--ok:#6fd298}}
:root[data-theme="dark"]{--bg:#151515;--sb:#1b1b1b;--ink:#f2f2ef;--mute:#9a9a95;--line:#2d2d2b;--soft:#222221;--ok:#6fd298}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sb{width:230px;flex:none;background:var(--sb);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:9px;align-items:center;font-weight:600;line-height:1.15;padding:0 8px 22px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:13px}
.sb a.n{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--mute);margin-bottom:2px}
.sb a.n:hover{background:var(--soft)}.sb a.n.on{background:var(--soft);color:var(--ink);font-weight:500}
.me{margin-top:auto;display:flex;gap:9px;align-items:center;padding:8px}
.me b{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px}
.me small{display:block;color:var(--mute);font-size:12px;line-height:1.2}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,44px) 72px;max-width:1080px}
h1{font-size:22px;font-weight:600;margin:0 0 18px}h2{font-size:15px;font-weight:600;margin:26px 0 10px}
.mut{color:var(--mute)}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
input.grow{flex:1;min-width:200px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:8px 16px;font-weight:500;cursor:pointer}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn:hover{opacity:.85}.btn.o:hover{background:var(--soft);opacity:1}
.seg{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 11px;cursor:pointer;color:var(--mute)}.seg button[aria-pressed=true]{background:var(--soft);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 16px}
.cd .th{aspect-ratio:4/5;margin-bottom:9px;cursor:pointer}.cd h3{font-size:14px;font-weight:500;margin:0;line-height:1.3}
.cd p{margin:2px 0;font-size:12.5px;color:var(--mute)}.cd .btn{width:100%;margin-top:8px}
.grid.list{grid-template-columns:1fr;gap:10px}.list .cd{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px}
.list .cd .th{margin:0;aspect-ratio:4/5}.list .cd .btn{width:auto;margin:0}
.th{--h:200;position:relative;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 9px,hsl(var(--h) 20% 100%/.05) 9px 10px),linear-gradient(160deg,hsl(var(--h) 30% 26%),hsl(var(--h) 35% 9%))}
.th::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:.85;font-size:18px}
.th b{position:absolute;right:7px;bottom:6px;font-size:11px;font-weight:500;background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:0 6px;z-index:1}
.sm .th{width:36px;height:46px;border-radius:6px;flex:none}.sm .th::after,.sm .th b{display:none}
.tb{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tr{display:grid;grid-template-columns:1fr 90px 90px 80px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.tr:first-child{border-top:0;color:var(--mute);font-size:12.5px;background:var(--sb)}.tr.c{cursor:pointer}.tr.c:hover{background:var(--soft)}
.tr .t{display:flex;gap:11px;align-items:center;min-width:0}.tr .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;white-space:nowrap;justify-self:start}.pill.ok{color:var(--ok);border-color:currentColor}
.cp{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}.cp:first-child{border-top:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600}
details.mn{position:relative}details.mn summary{list-style:none;cursor:pointer;padding:2px 10px;border-radius:6px;color:var(--mute)}details.mn summary:hover{background:var(--soft)}
details.mn button{position:absolute;right:0;top:28px;z-index:2;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;color:#c0392b}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.top h1{margin-bottom:2px}
.rm{display:grid;grid-template-columns:150px 1fr;gap:20px;margin:18px 0 6px}.rm .th{aspect-ratio:3/4}
.st{display:flex;gap:18px;margin-top:10px}.st b{display:block;font-size:16px}.st span{color:var(--mute);font-size:12px}
.fb{border-top:1px solid var(--line);padding:16px 0}.fb .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.fb h3{margin:0;font-size:16px;font-weight:600}
.fb textarea{width:100%;border-color:transparent;padding:6px 0;resize:none;line-height:1.55;background:transparent}.fb textarea:focus{border-color:var(--line);padding:6px 10px}
.fb .ct{text-align:right;color:var(--mute);font-size:12px}
.lk{background:none;border:0;color:var(--mute);cursor:pointer;font-size:12.5px}.lk:hover{color:var(--ink)}
.act{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding-top:16px;position:sticky;bottom:0;background:var(--bg)}
details.ot{margin:8px 0;border-top:1px solid var(--line);padding-top:12px}details.ot summary{cursor:pointer;color:var(--mute)}
.empty{padding:36px 0;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:5}
@media(max-width:820px){body{flex-direction:column}.sb{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}.logo{padding:0 8px 0 0;margin-right:auto}.me{display:none}
.grid{grid-template-columns:repeat(2,1fr)}.tr{grid-template-columns:1fr 80px}.tr>:nth-child(n+3){display:none}.rm{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<aside class="sb">
  <div class="logo"><i>ИИ</i><span>ИИ рилс<br>продюсер</span></div>
  <a class="n" href="#/home" data-nav="home">Главное</a>
  <a class="n" href="#/comp" data-nav="comp">Конкуренты</a>
  <div class="me"><b>А</b><div>Алексей<small>Демо-режим</small></div></div>
</aside>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>
<script>
var K='reelsradar_v2',AU=['vibecoding.dev','bubblethe_','nocode.studio'];
var RAW=[
["You're vibecoding it wrong.","Ты неправильно занимаешься вайбкодингом. Сначала опиши задачу, затем разбей её на маленькие шаги. Сохрани ролик и попробуй сегодня.",0,125000,8400,320,"2026-10-12","0:24"],
["3 AI tools every dev should be using","Три ИИ-инструмента, которые нужны каждому разработчику. Первый пишет тесты, второй проверяет код, третий объясняет чужой репозиторий. Подпишись, чтобы не потерять список.",1,94000,5100,210,"2026-10-11","0:31"],
["Stop building. Start shipping.","Хватит строить. Начни выпускать. Готовый продукт с ошибками лучше идеального в черновиках. Выложи свой проект сегодня.",2,210000,12300,540,"2026-10-10","0:19"],
["This one prompt = 10x better code","Один промпт, и код лучше в десять раз. Попроси ИИ сначала составить план, и только потом писать код. Напиши «план» в комментариях, пришлю шаблон.",0,76000,4200,180,"2026-10-09","0:27"],
["I built this in 30 minutes with AI","Я собрал это приложение за тридцать минут. ИИ сделал каркас, а детали я довёл руками. Хочешь разбор? Подпишись.",1,158000,9100,402,"2026-10-08","0:33"],
["The AI dev stack in 2026","Мой стек разработчика с ИИ в 2026 году. Редактор, агент в терминале и бесплатная база данных. Сохрани, чтобы собрать такой же.",2,102000,6000,260,"2026-10-07","0:22"],
["Why your prompts fail","Почему твои промпты не работают. Ты не даёшь контекст и не называешь нужный результат. Поделись с тем, кто тоже мучается.",0,88000,4700,150,"2026-10-06","0:18"],
["Ship a landing page in one evening","Лендинг за один вечер. Готовый шаблон, правки через ИИ и публикация в один клик. Напиши «лендинг» в комментариях за гайдом.",1,134000,7800,330,"2026-10-05","0:29"],
["Debugging with AI, step by step","Отладка с ИИ шаг за шагом. Покажи ошибку, лог и ожидаемый результат. Сохрани, пригодится при следующем баге.",2,67000,3900,120,"2026-10-04","0:26"]];
function split(t){var s=(t.match(/[^.!?]+[.!?]*/g)||[]).map(function(x){return x.trim()}).filter(Boolean);return{hook:s[0]||'',script:s.slice(1,-1).join(' '),cta:s.length>1?s[s.length-1]:''}}
function mk(id,x,a){return{id:id,a:a==null?AU[x[2]]:a,en:x[0],ru:x[1],views:x[3],likes:x[4],com:x[5],date:x[6],dur:x[7],orig:split(x[1]),remix:null,saved:false}}
function seed(){return{comps:AU.slice(),reels:RAW.map(function(x,i){return mk(i+1,x)})}}
function load(){try{var r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var S=load(),F={q:'',a:'',s:'',o:'views',v:'grid'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' млн':n>=1e3?(n>=1e5?Math.round(n/1e3):(n/1e3).toFixed(1).replace('.',','))+' тыс':String(n)}
function dt(d){var p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function byId(i){return S.reels.filter(function(r){return r.id==i})[0]}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},1800)}
function th(r,sm){return'<div class="th" style="--h:'+(r.id*47%360)+'"'+(sm?'':' data-remix="'+r.id+'"')+'><b>'+esc(r.dur)+'</b></div>'}
function stat(r){return r.saved?'<span class="pill ok">Ремикс готов</span>':'<span class="pill">В базе</span>'}
function card(r){return'<article class="cd">'+th(r)+'<div><h3>'+esc(r.en)+'</h3><p>@'+esc(r.a)+'</p><p>'+fmt(r.views)+' просмотров</p></div><button class="btn o" data-remix="'+r.id+'">Remix</button></article>'}
function homeList(){
  var l=S.reels.filter(function(r){return(!F.a||r.a===F.a)&&(!F.s||(F.s==='saved')===r.saved)&&(!F.q||(r.en+' '+r.a).toLowerCase().indexOf(F.q.toLowerCase())>-1)}).sort(function(a,b){return F.o==='date'?b.date.localeCompare(a.date):b.views-a.views});
  document.getElementById('cnt').textContent='Всего рилсов в базе: '+S.reels.length+(l.length!==S.reels.length?' · показано '+l.length:'');
  return l.length?l.map(card).join(''):'<div class="empty" style="grid-column:1/-1">Ничего не найдено. Измените поиск или фильтры.</div>'
}
function updHome(){var g=document.getElementById('grid');g.className='grid'+(F.v==='list'?' list':'');g.innerHTML=homeList()}
function viewHome(){
  return'<h1>Главное</h1><div class="bar"><input class="grow" id="q" placeholder="Поиск по рилсам и авторам" value="'+esc(F.q)+'" aria-label="Поиск"><select id="fa" aria-label="Автор"><option value="">Все авторы</option>'+S.comps.map(function(c){return'<option'+(c===F.a?' selected':'')+' value="'+esc(c)+'">@'+esc(c)+'</option>'}).join('')+'</select><select id="fs" aria-label="Статус"><option value="">Все статусы</option><option value="base"'+(F.s==='base'?' selected':'')+'>В базе</option><option value="saved"'+(F.s==='saved'?' selected':'')+'>Ремикс готов</option></select><select id="so" aria-label="Сортировка"><option value="views">По просмотрам</option><option value="date"'+(F.o==='date'?' selected':'')+'>Сначала новые</option></select><div class="seg"><button data-v="grid" aria-label="Сетка" aria-pressed="'+(F.v==='grid')+'">▦</button><button data-v="list" aria-label="Список" aria-pressed="'+(F.v==='list')+'">☰</button></div></div><p class="mut" id="cnt"></p><div id="grid" class="grid"></div>'
}
function viewComp(){
  var last=S.reels.slice().sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id}).slice(0,20);
  return'<h1>Конкуренты</h1><div class="bar"><input class="grow" id="nc" placeholder="Ссылка на аккаунт Instagram или @username" aria-label="Аккаунт"><button class="btn" data-act="addc">Загрузить 20 рилсов</button></div><p class="mut" style="margin:-6px 0 0;font-size:12.5px">Демо: создаются тестовые рилсы. В боевой версии их загружает Apify.</p><h2>Загруженные конкуренты</h2>'+
  (S.comps.length?'<div class="tb">'+S.comps.map(function(c){var n=S.reels.filter(function(r){return r.a===c}).length;return'<div class="cp"><div class="av">'+esc(c[0].toUpperCase())+'</div><div><div>'+esc(c)+'</div><div class="mut" style="font-size:12.5px">instagram.com/'+esc(c)+' · '+n+' рилсов</div></div><details class="mn"><summary aria-label="Меню">⋯</summary><button data-act="delc" data-c="'+esc(c)+'">Удалить</button></details></div>'}).join('')+'</div>':'<div class="empty">Добавьте первый аккаунт, чтобы загрузить рилсы.</div>')+
  '<h2>Последние 20 рилсов</h2>'+(last.length?'<div class="tb"><div class="tr"><div>Рилс</div><div>Просмотры</div><div>Дата</div><div>Статус</div></div>'+last.map(function(r){return'<div class="tr c sm" tabindex="0" data-remix="'+r.id+'"><div class="t">'+th(r,1)+'<span>'+esc(r.en)+'<br><small class="mut">@'+esc(r.a)+'</small></span></div><div>'+fmt(r.views)+'</div><div>'+dt(r.date)+'</div><div>'+stat(r)+'</div></div>'}).join('')+'</div>':'<div class="empty">Рилсов пока нет.</div>')
}
var FL=[['hook','Хук',100],['script','Скрипт',600],['cta','Call to action',200]];
function viewRemix(id){
  var r=byId(id);if(!r)return'<div class="empty">Рилс не найден. <a href="#/home">К рилсам</a></div>';
  var m=r.remix||r.orig;
  return'<p style="margin:0 0 14px"><a class="mut" href="#/home" style="text-decoration:none">← Назад к рилсам</a></p><div class="top"><div><h1>Ремикс рилса</h1><div class="mut">Создайте сценарий на основе исходного рилса</div></div><button class="btn" data-act="regen" data-id="'+r.id+'">↻ Регенерировать</button></div>'+
  '<div class="rm">'+th(r,0).replace(' data-remix="'+r.id+'"','')+'<div><div class="mut" style="font-size:12px">Автор</div><div style="font-weight:500">'+esc(r.a)+'</div><div class="mut" style="font-size:12.5px">instagram.com/'+esc(r.a)+'</div><div class="mut" style="font-size:12.5px">Опубликовано '+dt(r.date)+'</div><div class="st"><div><b>'+fmt(r.views)+'</b><span>Просмотры</span></div><div><b>'+fmt(r.likes)+'</b><span>Лайки</span></div><div><b>'+r.com+'</b><span>Комментарии</span></div></div></div></div>'+
  FL.map(function(f){return'<div class="fb"><div class="hd"><h3>'+f[1]+'</h3><button class="lk" data-act="edit" data-f="'+f[0]+'">Изменить</button></div><textarea id="f-'+f[0]+'" rows="'+(f[0]==='script'?5:2)+'" maxlength="'+f[2]+'" data-lim="'+f[2]+'">'+esc(m[f[0]])+'</textarea><div class="ct" id="c-'+f[0]+'">'+m[f[0]].length+'/'+f[2]+'</div></div>'}).join('')+
  '<details class="ot"><summary>Исходное описание и русский текст</summary><p class="mut">'+esc(r.en)+'</p><textarea id="ru" rows="3" style="width:100%">'+esc(r.ru)+'</textarea><p class="mut" style="font-size:12.5px">«Регенерировать» заново делит этот текст на блоки. В боевой версии перевод и разбор делает Gemini API.</p></details>'+
  '<div class="act"><button class="btn o" data-act="reset" data-id="'+r.id+'">Сбросить к оригиналу</button><button class="btn" data-act="save" data-id="'+r.id+'">Сохранить ремикс</button></div>'
}
function render(){
  var p=(location.hash||'#/home').split('/'),v=p[1]||'home',a=document.getElementById('app');
  a.innerHTML=v==='remix'?viewRemix(p[2]):v==='comp'?viewComp():viewHome();
  document.querySelectorAll('[data-nav]').forEach(function(n){n.classList.toggle('on',n.dataset.nav===(v==='remix'?'home':v))});
  if(document.getElementById('grid'))updHome();window.scrollTo(0,0)
}
document.addEventListener('click',function(e){
  var o=e.target.closest('[data-remix]');if(o){location.hash='#/remix/'+o.dataset.remix;return}
  var sv=e.target.closest('[data-v]');if(sv){F.v=sv.dataset.v;document.querySelectorAll('[data-v]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===F.v)});updHome();return}
  var b=e.target.closest('[data-act]');if(!b)return;var act=b.dataset.act,r=b.dataset.id&&byId(b.dataset.id),val=function(i){return document.getElementById(i).value.trim()};
  if(act==='edit'){var t=document.getElementById('f-'+b.dataset.f);t.focus();t.setSelectionRange(t.value.length,t.value.length)}
  if(act==='save'){r.remix={hook:val('f-hook'),script:val('f-script'),cta:val('f-cta')};r.ru=val('ru');r.saved=true;save();toast('Ремикс сохранён')}
  if(act==='reset'){r.remix=null;r.saved=false;save();toast('Возвращён оригинал');render()}
  if(act==='regen'){r.ru=val('ru');r.orig=split(r.ru);r.remix=null;r.saved=false;save();toast('Сценарий разобран заново');render()}
  if(act==='addc'){var u=val('nc').replace(/^.*instagram\.com\//i,'').replace(/[\/?].*$/,'').replace(/^@/,'').replace(/[^\w.]/g,'');
    if(!u){toast('Введите ссылку или username');return}if(S.comps.indexOf(u)>-1){toast('Этот аккаунт уже загружен');return}
    S.comps.push(u);var n=Date.now();for(var i=0;i<20;i++){var x=RAW[i%RAW.length].slice();x[3]=Math.round(40000+Math.random()*220000);x[4]=Math.round(x[3]*.06);x[5]=Math.round(x[3]*.003);x[6]='2026-10-'+(i%16+1<10?'0':'')+(i%16+1);S.reels.push(mk(n+i,x,u))}
    save();toast('Загружено 20 рилсов');render()}
  if(act==='delc'){var c=b.dataset.c;S.comps=S.comps.filter(function(x){return x!==c});S.reels=S.reels.filter(function(x){return x.a!==c});if(F.a===c)F.a='';save();render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.remix)location.hash='#/remix/'+e.target.dataset.remix});
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='q'){F.q=t.value;updHome()}
  if(t.dataset&&t.dataset.lim){document.getElementById('c-'+t.id.slice(2)).textContent=t.value.length+'/'+t.dataset.lim}});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='fa'){F.a=t.value;updHome()}if(t.id==='fs'){F.s=t.value;updHome()}if(t.id==='so'){F.o=t.value;updHome()}});
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
